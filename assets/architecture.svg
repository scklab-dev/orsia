<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-describedby="description">
  <desc id="description">The application selects Data I/O, selects Dispersion, Scene, Geometry, Radiative and Instruments calculations, and supplies callbacks or a matrix to Inverse. Inverse evaluates the supplied prediction and Jacobian callbacks. Geometry has an array core and SatKit adapters with public auxiliary data access. Instruments retains native observation cubes separately from registered reconstruction. Uncertainty supplies dense and source-projected covariance; Numerics supplies shared numerical capabilities. Numerics supplies explicit tangent and Jacobian assembly, general linear operators, shared C++ tangent headers and optional CPU execution with native thread controls and available affinity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52677d"/>
    </marker>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #243b58; font-size: 24px; }
    .name { font-size: 28px; font-weight: 700; }
    .group { font-size: 25px; font-weight: 700; fill: #52677d; }
    .small { font-size: 22px; }
    .call { fill: none; stroke: #52677d; stroke-width: 2.5; marker-end: url(#arrow); }
    .box { stroke-width: 1.5; rx: 8; }
  </style>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Selected calls; scientific peers deliberately have no pipeline arrows. -->
  <g aria-label="Selected application calls">
    <path class="call" d="M 180 130 V 232"/>
    <text x="198" y="196" class="small">acquire / read</text>
    <path class="call" d="M 760 130 V 232"/>
    <text x="778" y="196" class="small">compose calls</text>
    <path class="call" d="M 1240 130 V 232"/>
    <text x="1258" y="184" class="small"><tspan x="1258">solve /</tspan><tspan x="1258" dy="28">diagnose</tspan></text>
    <path class="call" stroke-dasharray="7 6" d="M 1510 232 V 130"/>
    <text x="1396" y="196" class="small">fun / jac</text>
  </g>

  <g data-qa-block="application">
    <rect class="box" x="40" y="24" width="1520" height="106" fill="#243b58" stroke="#243b58"/>
    <text x="66" y="65" class="name" style="fill:#ffffff">Caller-owned application and model composition</text>
    <text x="66" y="104" style="fill:#ffffff">Scenes, data choices, physical assumptions, derivatives, random streams and execution budgets</text>
  </g>

  <g data-qa-block="data">
    <rect class="box" x="40" y="232" width="280" height="402" fill="#fff4df" stroke="#c4a56c"/>
    <text x="64" y="300" class="name">Data</text>
    <text x="64" y="345"><tspan x="64">Explicit acquisition</tspan><tspan x="64" dy="36">Local readers</tspan><tspan x="64" dy="36">Geospatial</tspan><tspan x="64" dy="32">preparation</tspan></text>
    <text x="64" y="510" class="small"><tspan x="64">Files, providers</tspan><tspan x="64" dy="32">and owned sessions</tspan></text>
  </g>

  <g aria-label="Scientific model components">
    <rect class="box" x="350" y="232" width="820" height="402" fill="#f7f9fc" stroke="#c6d1df"/>
    <text x="374" y="269" class="group">Scientific model components</text>
    <g data-qa-block="geometry">
      <rect class="box" x="374" y="286" width="238" height="176" fill="#e9effb" stroke="#7798c0"/>
      <text x="394" y="322" class="name">Geometry</text>
      <text x="394" y="357" class="small"><tspan x="394">Rays / terrain</tspan><tspan x="394" dy="28">Orbits / frames</tspan><tspan x="394" dy="28">SatKit adapters +</tspan><tspan x="394" dy="28">public auxiliaries</tspan></text>
    </g>
    <g data-qa-block="radiative">
      <rect class="box" x="636" y="286" width="238" height="176" fill="#e9effb" stroke="#7798c0"/>
      <text x="656" y="322" class="name">Radiative</text>
      <text x="656" y="357" class="small"><tspan x="656">Spectroscopy / optics</tspan><tspan x="656" dy="28">Solar / thermal</tspan><tspan x="656" dy="28">radiance</tspan><tspan x="656" dy="28">Explicit tangents</tspan></text>
    </g>
    <g data-qa-block="instruments">
      <rect class="box" x="898" y="286" width="248" height="176" fill="#e9effb" stroke="#7798c0"/>
      <text x="918" y="322" class="name">Instruments</text>
      <text x="918" y="357" class="small"><tspan x="918">Acquisition / optics</tspan><tspan x="918" dy="28">Electrons / readout</tspan><tspan x="918" dy="28">Calibration / cubes</tspan><tspan x="918" dy="28">Native or registered</tspan></text>
    </g>
    <g data-qa-block="dispersion">
      <rect class="box" x="374" y="486" width="374" height="124" fill="#e9effb" stroke="#7798c0"/>
      <text x="394" y="522" class="name">Dispersion</text>
      <text x="394" y="557" class="small"><tspan x="394">Passive Gaussian puff transport</tspan><tspan x="394" dy="28">Concentration / mass integrals</tspan></text>
    </g>
    <g data-qa-block="scene">
      <rect class="box" x="772" y="486" width="374" height="124" fill="#e9effb" stroke="#7798c0"/>
      <text x="792" y="522" class="name">Scene</text>
      <text x="792" y="557" class="small"><tspan x="792">Spatial radiance / sensitivities</tspan><tspan x="792" dy="28">Flat local surface queries</tspan></text>
    </g>
  </g>

  <g data-qa-block="inverse">
    <rect class="box" x="1200" y="232" width="360" height="402" fill="#e8f4ee" stroke="#75a898"/>
    <text x="1224" y="300" class="name">Inverse</text>
    <text x="1224" y="345"><tspan x="1224">Prediction + Jacobian</tspan><tspan x="1224" dy="36">or explicit linear matrix</tspan></text>
    <text x="1224" y="474"><tspan x="1224">Gaussian estimation</tspan><tspan x="1224" dy="36">Rank / local diagnostics</tspan></text>
  </g>

  <g aria-label="Cross-cutting capabilities">
    <rect class="box" x="40" y="660" width="1520" height="215" fill="#f7f9fc" stroke="#c6d1df"/>
    <text x="64" y="697" class="group">Cross-cutting capabilities</text>
    <g data-qa-block="uncertainty">
      <rect class="box" x="64" y="717" width="716" height="134" fill="#e8f4ee" stroke="#75a898"/>
      <text x="88" y="753" class="name">Uncertainty</text>
      <text x="88" y="786" class="small"><tspan x="88">Dense / source-projected covariance and transport</tspan><tspan x="88" dy="28">Signed bias / common errors / low-rank solves</tspan></text>
    </g>
    <g data-qa-block="numerics">
      <rect class="box" x="804" y="717" width="732" height="134" fill="#ffffff" stroke="#8fa2b8"/>
      <text x="828" y="753" class="name">Numerics</text>
      <text x="828" y="786" class="small"><tspan x="828">Tangents / Jacobians / operators + shared C++ headers</tspan><tspan x="828" dy="28">Optional CPU pool: native controls, available affinity</tspan></text>
    </g>
  </g>
</svg>
