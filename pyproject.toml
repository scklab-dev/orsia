[project]
name = "orsia-workspace"
version = "0.1.0"
description = "Development workspace for reusable Orsia scientific libraries"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/orsia-numerics", "libs/orsia-uncertainty", "libs/orsia-radiative", "libs/orsia-data", "libs/orsia-instruments", "libs/orsia-inverse"]

[tool.uv.sources]
orsia-numerics = { workspace = true }
orsia-uncertainty = { workspace = true }
orsia-radiative = { workspace = true }
orsia-data = { workspace = true }
orsia-instruments = { workspace = true }
orsia-inverse = { workspace = true }

[dependency-groups]
dev = [
    "coverage[toml]>=7.14,<8",
    "numpy>=2.3,<3",
    "pyrefly>=1.3.1,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=7.1,<8",
    "pybind11==3.0.2",
    "ruff>=0.16.7,<0.17",
    "scipy>=1.16,<2",
    "cdsapi>=0.7,<0.8",
    "ipykernel>=7,<8",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "matplotlib>=3.10,<4",
    "python-dotenv>=1,<2",
]
sasktran2-reference = ["sasktran2==2026.10.0"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
preview = true
explicit-preview-rules = true
extend-select = ["D100", "D101", "D102", "D103", "D104", "D200", "D201", "D202", "D205", "D400", "D403", "D404", "D415", "D417", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]

# Documentation rules cover maintained library sources; tests, scripts and notebook
# companions keep the existing E/F/I/UP/B checks without imposing API documentation.
[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["D", "DOC"]
"notebooks/support/**/*.py" = ["D", "DOC"]
"tests/**/*.py" = ["D", "DOC"]
"libs/*/tests/**/*.py" = ["D", "DOC"]

[tool.pytest.ini_options]
# Notebook companions are workspace namespace modules, not installed packages.
pythonpath = ["."]
testpaths = ["tests", "libs/orsia-numerics/tests", "libs/orsia-uncertainty/tests", "libs/orsia-radiative/tests", "libs/orsia-data/tests", "libs/orsia-instruments/tests", "libs/orsia-inverse/tests"]
addopts = "-ra --cov --cov-config=pyproject.toml --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["libs/orsia-numerics/src", "libs/orsia-uncertainty/src", "libs/orsia-radiative/src", "libs/orsia-data/src", "libs/orsia-instruments/src", "libs/orsia-inverse/src"]
relative_files = true

[tool.coverage.report]
fail_under = 90
precision = 2

[tool.pyrefly]
project-includes = ["scripts/**/*.py", "tests/**/*.py", "libs/*/src/**/*.py", "libs/*/tests/**/*.py"]
search-path = ["libs/orsia-radiative/tests", "tests"]
python-version = "3.14"
