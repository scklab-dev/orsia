[project]
name = "orsia-scene"
version = "0.1.0"
description = "Physical spatial-scene composition and observation queries for Orsia"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.3,<3", "scipy>=1.16,<2", "orsia-geometry==0.1.0", "orsia-dispersion==0.1.0", "orsia-radiative==0.1.0"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "README.md" },
  { file = "src/**/*.py" },
  { file = "src/**/py.typed" },
]
