[project]
name = "orsia-data"
version = "0.1.0"
description = "Explicit scientific acquisition, product readers and geospatial preparation"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.3,<3", "scipy>=1.16,<2", "xarray>=2026.1,<2027", "orsia-radiative==0.1.0"]

[project.optional-dependencies]
hitran = ["hitran-api==1.3.0.0"]
atmosphere = ["cfgrib>=0.9.15,<0.10", "eccodes>=2.47,<3", "h5netcdf>=1.6,<2", "h5py>=3.15,<4"]
geospatial = ["rasterio>=1.5,<2", "pyproj>=3.7,<4", "h5py>=3.15,<4"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
