[project]
name = "orsia-uncertainty"
version = "0.1.0"
description = "Generic covariance, bias and propagation algebra for Orsia"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.3,<3", "scipy>=1.16,<2"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
