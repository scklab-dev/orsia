[project]
name = "orsia-geometry"
version = "0.1.0"
description = "Array-only observation geometry and supplied-trajectory pointing"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.3,<3", "satkit==0.24.1"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
