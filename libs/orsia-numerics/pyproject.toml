[project]
name = "orsia-numerics"
version = "0.1.0"
description = "Numerical kernels, owned array storage and explicit CPU execution for Orsia"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.3,<3", "scipy>=1.16,<2", "threadpoolctl>=3.6,<4"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
